# ── Cross-drive Kotlin incremental compilation fix (Windows) ────────────────
# Kotlin's incremental compiler calls File.relativeTo() when writing its cache.
# On Windows, if the Pub Cache (C:\Users\...\AppData\Local\Pub\Cache\) and the
# Flutter project live on different drives (e.g. G:\Android\...), relativeTo()
# throws: "this and base files have different roots".
#
# Setting kotlin.incremental=false tells the Kotlin Gradle daemon to skip
# incremental compilation entirely for this module, eliminating the relativeTo()
# call and the cross-drive crash. This property is read by the daemon directly
# and is the only reliable way to disable incremental compilation at the module
# level on Windows multi-drive setups.
#
# Build time impact: ~1-3 s extra on subsequent builds for this module only
# (the module has a single Kotlin file, so the impact is negligible).
kotlin.incremental=false
